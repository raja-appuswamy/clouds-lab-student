# Service (provided): a stable name + virtual IP in front of whichever pods carry app=chat,
# exposed on node port 30080 (mapped to Cloud Shell's localhost:30080 by kind-config.yaml).
apiVersion: v1
kind: Service
metadata:
  name: chat
spec:
  type: NodePort
  selector:
    app: chat
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
