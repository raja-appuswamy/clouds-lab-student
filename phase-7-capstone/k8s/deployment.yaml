# Deployment: the same chat container, run by Kubernetes instead of Cloud Run.
#
# In Cloud Run you asked for "up to 3 instances, concurrency 5" and the platform did the rest.
# Here YOU are the platform: you say how many replicas, how a pod proves it is ready, and what
# it may consume. The image is the one kind loaded from your Docker daemon (Task 8) — the node
# cannot pull from Artifact Registry, hence imagePullPolicy: IfNotPresent.
#
# STORE_BACKEND is memory on purpose: pods in kind have no Google identity, so Firestore (and
# BigQuery, so /chat) are unreachable from here. /healthz and /sessions work — and with two
# replicas behind one Service you will see Phase 4's lesson again: history written on one pod
# is unknown to the other. On GKE, Workload Identity would give the pods an identity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  labels:
    app: chat
spec:
  # TODO: replicas: 2  (two pods, so the Service has something to balance across)
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - name: chat
          image: IMAGE_PLACEHOLDER   # <-- your image, e.g. us-central1-docker.pkg.dev/<project>/eurecomgpt/chat:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: STORE_BACKEND
              value: memory
            - name: MODEL_URL
              value: https://storage.googleapis.com/PROJECT_PLACEHOLDER-eurecomgpt/model.safetensors
            - name: BQ_TABLE
              value: unused.in.kind
          # TODO: a readinessProbe (httpGet /healthz on 8080) so the Service only routes to pods
          #       that answer, and resources (requests: 256Mi / 100m, limits: 512Mi) so two pods
          #       fit in Cloud Shell's memory.
